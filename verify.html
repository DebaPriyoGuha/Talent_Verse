<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>knackbook — Verify your email</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

<div class="auth-page">
    <div class="auth-box" style="text-align:center">
        <div class="auth-logo">✦ knackbook</div>
        <p class="auth-tagline">One quick step to secure your account.</p>

        <div style="font-size:2.4rem;color:var(--purple);margin:10px 0 4px">
            <i class="fas fa-envelope-circle-check"></i>
        </div>
        <h2 style="font-size:1.15rem;margin-bottom:8px">Verify your email</h2>
        <p style="color:var(--muted);font-size:.9rem;line-height:1.6">
            We've sent a verification link to<br>
            <b id="vEmail">your email</b>.<br>
            Open it, click the link, then come back and press <b>I've verified</b>.
        </p>

        <div id="vMsg" class="auth-error" style="display:none;margin-top:14px"></div>

        <button class="btn-auth" id="vContinue" style="margin-top:16px">
            <i class="fas fa-circle-check"></i> I've verified — continue
        </button>
        <button class="btn-guest" id="vResend" style="margin-top:10px">
            <i class="fas fa-paper-plane"></i> Resend link
        </button>

        <p style="margin-top:14px;font-size:.82rem">
            <a href="#" id="vLogout" style="color:var(--muted)">Log out</a>
        </p>
        <p style="margin-top:6px;font-size:.75rem;color:var(--muted)">
            Tip: check your spam folder if you don't see it.
        </p>
    </div>
</div>

<script type="module">
import { auth, onAuthStateChanged, signOut, needsEmailVerification } from './js/auth.js?v=19';
import { sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const msg = document.getElementById('vMsg');
function show(text, ok) {
    msg.className = ok ? 'auth-success' : 'auth-error';
    msg.textContent = text;
    msg.style.display = 'block';
}

onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href = 'login.html'; return; }
    document.getElementById('vEmail').textContent = user.email || '(your email)';

    // Already verified (or exempt)? Go straight in.
    try { await user.reload(); } catch (e) {}
    if (!needsEmailVerification(auth.currentUser)) {
        window.location.href = 'index.html';
    }
});

document.getElementById('vContinue').addEventListener('click', async () => {
    const btn = document.getElementById('vContinue');
    btn.disabled = true;
    try {
        await auth.currentUser.reload();
        if (!needsEmailVerification(auth.currentUser)) {
            window.location.href = 'index.html';
        } else {
            show("Not verified yet — click the link in your email, then try again.", false);
            btn.disabled = false;
        }
    } catch (e) { show(e.message, false); btn.disabled = false; }
});

document.getElementById('vResend').addEventListener('click', async () => {
    const btn = document.getElementById('vResend');
    btn.disabled = true;
    try {
        await sendEmailVerification(auth.currentUser);
        show("✓ Verification link sent again. Check your inbox (and spam).", true);
    } catch (e) {
        show(e.code === 'auth/too-many-requests'
            ? "Too many requests — please wait a bit before resending."
            : e.message, false);
    }
    setTimeout(() => { btn.disabled = false; }, 4000);
});

document.getElementById('vLogout').addEventListener('click', e => {
    e.preventDefault();
    signOut(auth).then(() => window.location.href = 'login.html');
});
</script>
</body>
</html>
